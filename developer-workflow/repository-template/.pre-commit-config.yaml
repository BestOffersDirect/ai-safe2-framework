repos:
  - repo: local
    hooks:
      - id: ai-safe2-local-gate
        name: AI SAFE2 local gate
        entry: scripts/run_local_gate.py --config .ai-safe2/local-gate.json --repository .
        language: python
        additional_dependencies:
          - jsonschema==4.26.0
        pass_filenames: false
        always_run: true
