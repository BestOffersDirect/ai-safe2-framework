repos:
  - repo: local
    hooks:
      - id: ai-safe2-developer-workflow-local-gate
        name: AI SAFE2 Developer Workflow local gate
        entry: developer-workflow/scripts/run_local_gate.py --config developer-workflow/local-gate.json --repository developer-workflow
        language: python
        additional_dependencies:
          - pytest==9.2.0
          - jsonschema==4.26.0
          - mypy==1.19.0
        pass_filenames: false
        always_run: true
