name: Developer Workflow qualification
on:
  pull_request:
    paths:
      - 'developer-workflow/**'
      - '.github/workflows/developer-workflow-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install -r developer-workflow/requirements-dev.txt
      - name: Validate package and clean installation canary
        run: python developer-workflow/scripts/run_local_gate.py --config developer-workflow/local-gate.json --repository developer-workflow
